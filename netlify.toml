[build]
  command = "node scripts/write-admin-env.mjs && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  node_bundler = "esbuild"
  # Bundle @netlify/blobs into the function. Marking it external makes the
  # Lambda runtime load main.cjs, which cannot require the ESM-only
  # @netlify/runtime-utils package.

# API must come before the SPA fallback
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run client"
  targetPort = 5173
  port = 8888
  autoLaunch = false
